name: INDART3D - Validar scripts y actualizador
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev
      - run: python3 -m unittest discover -s tests -v
      - run: g++ -std=c++23 -Ipatches tests/test_update.cpp -o /tmp/test-indart-update && /tmp/test-indart-update
      - run: bash -n scripts/post_build_indart.sh
