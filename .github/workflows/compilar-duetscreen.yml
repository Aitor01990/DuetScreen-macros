name: INDART3D - Compilar pruebas ARM T113
on:
  workflow_dispatch:
    inputs:
      full_image:
        description: Generar también sdcard.img (necesario para publicar)
        type: boolean
        default: false
      allow_unbranded:
        description: Sólo desarrollo sin logo original (NO publicable)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    env:
      DUETSCREEN_SRC: ${{ github.workspace }}/DuetScreen
      DUETSCREEN_PRESET: T113-Release
      BR2_DL_DIR: ${{ github.workspace }}/buildroot-duetscreen/dl
      BR2_JLEVEL: '2'
    steps:
      - name: Checkout distribución INDART3D
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validar configuración y logo antes de compilar
        run: |
          set -euo pipefail
          mkdir -p artifacts
          python3 -m venv .ci-env
          .ci-env/bin/pip install Pillow==12.3.0
          .ci-env/bin/python scripts/distribution.py
          if [ '${{ inputs.allow_unbranded }}' != 'true' ]; then
            .ci-env/bin/python -c 'import sys; sys.path.insert(0,"scripts"); from distribution import config,check_logo; check_logo(config())'
          fi
      - name: Checkout stable DuetScreen and submodules
        uses: actions/checkout@v4
        with:
          repository: Duet3D/DuetScreen
          ref: 8cf206ddd2aad3a55852eb2125a318d94c8601f3
          path: DuetScreen
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Checkout Buildroot v0.4.4
        uses: actions/checkout@v4
        with:
          repository: Duet3D/buildroot-duetscreen
          ref: 7b01688559a5602a55d564651db279674a237263
          path: buildroot-duetscreen
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - name: Free disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
          df -h .
          available=$(df --output=avail -k . | tail -1)
          if (( available < 30 * 1024 * 1024 )); then
            echo '::error::Need at least 30 GiB free'; exit 1
          fi
      - name: Install host prerequisites
        run: |
          set -euo pipefail
          bash buildroot-duetscreen/scripts/install_prerequisites.sh
          sudo apt-get install -y ninja-build binutils libelf-dev zstd lz4 p7zip-full python3-venv e2fsprogs nlohmann-json3-dev
          python3 -m venv DuetScreen/env
          DuetScreen/env/bin/pip install -r DuetScreen/requirements.txt
      - name: Cache public downloads
        uses: actions/cache@v4
        with:
          path: buildroot-duetscreen/dl
          key: duetscreen-downloads-v044-${{ runner.os }}-v1
      - name: Probar actualizador y scripts
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          g++ -std=c++23 -Ipatches tests/test_update.cpp -o /tmp/test-indart-update
          /tmp/test-indart-update
      - name: Preparar distribución sin alterar thumbnails validados
        run: |
          set -euo pipefail
          options=()
          if [ '${{ inputs.allow_unbranded }}' = 'true' ]; then options+=(--allow-unbranded); fi
          .ci-env/bin/python tests/check_source.py DuetScreen buildroot-duetscreen "${options[@]}"
          .ci-env/bin/python scripts/prepare_source.py --source DuetScreen --buildroot buildroot-duetscreen "${options[@]}"
          chmod +x scripts/post_build_indart.sh
          git -C DuetScreen submodule status --recursive | tee artifacts/submodules.txt
          if grep -Eq '^[-+U]' artifacts/submodules.txt; then exit 1; fi
          git -C DuetScreen -c core.whitespace=cr-at-eol diff --check
          git -C DuetScreen diff --binary > artifacts/distribution.patch
          cp distribution/config.json artifacts/distribution-config.json
      - name: Compile ARM T113 Release
        working-directory: buildroot-duetscreen
        run: |
          set -euo pipefail
          make duet3d_duetscreen_defconfig
          make BR2_JLEVEL=2 duetscreen-reconfigure 2>&1 | tee ../artifacts/build-duetscreen.log
          test -x output/target/usr/bin/DuetScreen
          mapfile -t binaries < <(find output/build -path '*/duetscreen-*/out/build/T113-Release/DuetScreen' -type f)
          test "${#binaries[@]}" -eq 1
          binary="${binaries[0]}"
          cmp "$binary" output/target/usr/bin/DuetScreen
          if [ '${{ inputs.full_image }}' = 'true' ]; then
            make BR2_JLEVEL=2 2>&1 | tee ../artifacts/build-buildroot.log
          else
            make BR2_JLEVEL=2 target-finalize 2>&1 | tee ../artifacts/build-buildroot.log
          fi
      - name: Empaquetar y verificar instaladores reales
        run: |
          set -euo pipefail
          (cd DuetScreen && ./scripts/create_upgrade.sh)
          cp DuetScreen/out/DuetScreen.tar.gz artifacts/
          options=()
          if [ '${{ inputs.full_image }}' = 'true' ]; then
            cp buildroot-duetscreen/output/images/sdcard.img artifacts/
            options+=(--full-image)
          fi
          if [ '${{ inputs.allow_unbranded }}' = 'true' ]; then options+=(--allow-unbranded); fi
          .ci-env/bin/python scripts/verify_artifacts.py "${options[@]}" | tee artifacts/verification.log
          tar -tvzf artifacts/DuetScreen.tar.gz > artifacts/archive-permissions.txt
          file buildroot-duetscreen/output/target/usr/bin/DuetScreen > artifacts/architecture.txt
          python3 scripts/snapshot_source.py
          echo 'Validaciones superadas. Falta prueba física. No se ha publicado ninguna Release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Subir instaladores verificados (14 días)
        uses: actions/upload-artifact@v4
        with:
          name: INDART3D-instaladores
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
          path: |
            artifacts/DuetScreen.tar.gz
            artifacts/sdcard.img
            artifacts/SHA256SUMS.txt
            artifacts/build-manifest.json
      - name: Subir informe y parches (14 días)
        uses: actions/upload-artifact@v4
        with:
          name: INDART3D-informe
          retention-days: 14
          path: |
            artifacts/*.txt
            artifacts/*.json
            artifacts/*.patch
            artifacts/modified-source.zip
      - name: Upload logs even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: INDART3D-logs
          if-no-files-found: warn
          retention-days: 7
          path: artifacts/*.log
      - name: Report failure
        if: failure()
        run: |
          echo '::error::Compilation or validation failed. No validated USB package was published.'
          echo '### FAILED: inspect the red step and build logs' >> "$GITHUB_STEP_SUMMARY"
